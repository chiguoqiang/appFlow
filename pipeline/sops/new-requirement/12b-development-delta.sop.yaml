sop: 12b-development-delta
stage: development_delta
name: 增量开发
flow: new_requirement
owner_agent: developer
description: >
  在既有代码库上做最小改动：不重构无关代码、不动无关文件、
  必须为变更补测试且不破坏既有测试。
depends_on: [11-planning-delta]

inputs:
  - path: pipeline/projects/{{project}}/11-prd-delta.md
    deliverable: prd_delta
  - path: pipeline/projects/{{project}}/12-design-delta.md
    deliverable: design_delta
    required: false
    description: 仅涉及新页面时存在

output:
  deliverable: dev_report_delta
  path: pipeline/projects/{{project}}/13-dev-delta.md
  manifest: pipeline/manifests/dev_report_delta.manifest.yaml

steps:
  - id: check-inputs
    action: validate_inputs
    params:
      requires:
        - path: pipeline/projects/{{project}}/11-prd-delta.md
          deliverable: prd_delta
          min_status: approved
      forbidden_stale: [prd_delta, design_delta]

  - id: baseline-check
    action: check_rules
    description: 基线健康检查——改动前既有代码必须 analyze 零告警、test 全绿，否则无法归因
    params:
      ruleset: pipeline/gates/dod.rules.yaml
      target: "{{target_project}}"
      rule_ids: [DOD-01, DOD-02]

  - id: implement-delta
    action: invoke_agent
    params:
      agent: developer
      agent_definition: pipeline/agents/developer.md
      output_path: pipeline/projects/{{project}}/13-dev-delta.md
      output_manifest: pipeline/manifests/dev_report_delta.manifest.yaml
      context:
        task: "按增量 PRD 实施最小改动，补测试，不破坏既有测试"
        must_read:
          - pipeline/projects/{{project}}/11-prd-delta.md
          - pipeline/projects/{{project}}/12-design-delta.md
          - "{{target_project}}/AGENTS.md"
          - pipeline/projects/{{target_project}}/01-prd.md
        focus:
          - "改动文件清单必须列全（新增/修改/删除），供评审与回归圈定范围"
          - "每条变更必须有对应测试（新增用例或修改既有用例）"
          - "禁止顺手重构无关代码（diff 范围必须与增量 PRD 一一对应）"
          - "破坏既有测试必须显式说明并说明原因，不得静默改断言"
          - "数据模型变更必须实现迁移/兼容读取"
        constraints:
          - "不得修改 11-prd-delta.md 等上游交付物"
          - "既有测试若有改动，必须逐条说明改了什么、为什么"
      timeout_sec: 1800
    on_fail: retry

  - id: dod-check-delta
    action: check_rules
    description: 增量 DoD：analyze 零告警、全部测试（含既有）全绿、改动范围可控
    params:
      ruleset: pipeline/gates/dod.rules.yaml
      target: "{{target_project}}"
      rule_ids: [DOD-01, DOD-02, DOD-06]

  - id: validate-dev-delta
    action: validate_deliverable
    params:
      deliverable: dev_report_delta
      manifest: pipeline/manifests/dev_report_delta.manifest.yaml
      fail_on: any

  - id: gate
    action: human_gate
    params:
      title: "增量关卡 3 · 代码评审"
      actions: [approve, revise, reject]
      review_package:
        - pipeline/projects/{{project}}/13-dev-delta.md
      review_package_extra:
        - "改动文件清单 + diff"
      require_comment_on: [revise, reject]

gate:
  enabled: true
  title: "增量关卡 3 · 代码评审"
  actions: [approve, revise, reject]
  review_package:
    - pipeline/projects/{{project}}/13-dev-delta.md
  require_comment_on: [revise, reject]

on_approve:
  deliverable_status: approved
  next_sop: 13-testing-regression

on_revise:
  deliverable_status: in-review
  increment_version: true
  require_structured_opinion: true

on_reject:
  deliverable_status: stale
  propagate_stale: [test_report_delta, acceptance_report_delta]
  reopen_sop: 11-planning-delta

dod:
  - "pipeline validate {{project}} --deliverable=dev_report_delta 通过"
  - "DOD-01/02/06 通过"
  - "改动文件清单与增量 PRD 变更项可一一对应"
  - "既有测试通过数不低于改动前基线"
