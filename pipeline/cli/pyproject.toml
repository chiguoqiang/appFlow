[project]
name = "pipeline-cli"
version = "0.2.0"
description = "AI 移动应用生产线 · SOP 调度器内核（M2）"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pipeline = "pipeline_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
